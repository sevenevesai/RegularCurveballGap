name: Certificates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
        working-directory: .
      - run: python exact.py
      - run: python obstruction.py
      - run: python rooted.py 6 2 7 2 8 2 8 3 9 2 9 4 10 2 10 3 10 4 11 2 11 4 12 2 12 3 --workers 4
      - name: Negative control, must exit nonzero
        run: '! python rooted.py 8 3 --threshold-shift 2'
      - run: python bipartite.py
